name: Проверки

on:
  push:
    branches: [master]
  pull_request:
  # Запуск вручную на любой ветке: проверить ветку до слияния в master
  workflow_dispatch:

jobs:
  rules:
    name: Правила CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-rules.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Тесты создают свою базу через служебную базу postgres и применяют миграции Alembic
    services:
      postgres:
        # Те же версии PostgreSQL и Redis, что на сервере (deploy/docker-compose.yml)
        image: postgres:18
        env:
          POSTGRES_USER: capper
          POSTGRES_PASSWORD: capper
          POSTGRES_DB: capper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPPER_DATABASE_URL: postgresql+asyncpg://capper:capper@localhost:5432/capper
      CAPPER_TEST_ADMIN_DATABASE_URL: postgresql://capper:capper@localhost:5432/postgres
      CAPPER_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      # Зависимости — точные версии с хешами из lock-файла, затем сам пакет без зависимостей.
      # pip check: lock-файл не отстал от pyproject.toml (нет пакета или версия ниже границы)
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: pip check
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  # Известные уязвимости в зависимостях (PLAN.md, раздел 7): pip-audit по обоим lock-файлам
  # backend (без установки, по точным версиям) и npm audit по зависимостям сборки frontend.
  # Обновления зависимостей предлагает Dependabot (.github/dependabot.yml)
  audit:
    name: Уязвимости зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.lock
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements-dev.lock
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Схема OpenAPI и типы API совпадают с текущим backend: gen:api берет схему из кода
      # backend (сервер и база не нужны) и заново пишет openapi.json и src/api/schema.d.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Те же версии, что в образе backend: от pydantic и FastAPI зависит схема.
      # pip check: requirements.lock (по нему собирается образ) не отстал от pyproject.toml
      - run: pip install --require-hashes -r ../backend/requirements.lock
      - run: pip install --no-deps -e ../backend
      - run: pip check
      - run: npm run gen:api
      - name: Типы API актуальны
        run: |
          if ! git diff --exit-code -- openapi.json src/api/schema.d.ts; then
            echo "::error::openapi.json или src/api/schema.d.ts устарели: выполните npm run gen:api и закоммитьте результат"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: Сквозные тесты в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    # scripts/e2e-stack.sh создает временную базу через служебную базу postgres, применяет
    # миграции, запускает uvicorn и vite preview; Playwright поднимает стек сам (webServer)
    services:
      postgres:
        # Те же версии PostgreSQL и Redis, что на сервере (deploy/docker-compose.yml)
        image: postgres:18
        env:
          POSTGRES_USER: capper
          POSTGRES_PASSWORD: capper
          POSTGRES_DB: capper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_PG_ADMIN_URL: postgresql://capper:capper@localhost:5432/postgres
      E2E_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Backend как в образе: точные версии с хешами, затем сам пакет без зависимостей
      - run: pip install --require-hashes -r ../backend/requirements.lock
      - run: pip install --no-deps -e ../backend
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Chromium под версию @playwright/test из package-lock.json, с системными библиотеками
      - run: npx playwright install --with-deps chromium
      - name: Playwright (оболочка и сценарии на настоящем API)
        run: npx playwright test
        env:
          E2E_STATE_DIR: ${{ runner.temp }}/e2e-stack
      - name: Отчет Playwright и логи стека
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/e2e-stack/*.log
          retention-days: 14

  # Весь стек в Docker с нуля, как у владельца (deploy/local.sh) и на сервере: сборка всех
  # образов, docker compose up на пустых томах (миграции — сервис migrate), здоровье через
  # Caddy, create-admin на чистой базе, бэкап и проверка восстановления из него
  stack:
    name: Docker-стек с нуля
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Настройки стека (одноразовые пароли и ключи)
        run: |
          umask 077
          {
            echo "CAPPER_DOMAIN=localhost"
            echo "CAPPER_EDGE_IPV6=false"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "CAPPER_SECRET_KEY=$(openssl rand -hex 32)"
            echo "CAPPER_MASTER_KEYS=1:$(openssl rand -base64 32)"
            echo "BACKUP_LOCAL_DIR=./backup/dumps-ci"
          } > .env
      - name: Сборка образов
        run: docker compose build
      - name: Ключи age для бэкапов
        run: |
          out="$(docker compose run --rm --no-deps --entrypoint age-keygen backup 2>&1)"
          pub="$(printf '%s\n' "$out" | sed -n 's/.*public key: \(age1[0-9a-z]*\).*/\1/p' | head -n1)"
          sec="$(printf '%s\n' "$out" | grep -o 'AGE-SECRET-KEY-1[0-9A-Z]*' | head -n1)"
          test -n "$pub" && test -n "$sec"
          printf 'BACKUP_AGE_RECIPIENTS=%s\nBACKUP_AGE_IDENTITY=%s\n' "$pub" "$sec" >> .env
      - name: docker compose up на пустых томах
        run: docker compose up -d --wait --wait-timeout 300
      - name: Здоровье через Caddy
        run: |
          body="$(curl --silent --show-error --fail --insecure --max-time 10 \
            --resolve localhost:443:127.0.0.1 https://localhost/api/health)"
          echo "$body"
          [[ "$body" == *'"status":"ok"'* ]]
      - name: create-admin на чистой базе
        run: |
          printf '%s\n' "ci-$(openssl rand -hex 16)" | docker compose exec -T api \
            python -m app.admin.cli create-admin --email owner@example.com --name CI --password-stdin
      - name: Бэкап и проверка восстановления
        run: |
          docker compose exec -T backup backup.sh
          docker compose exec -T backup restore-check.sh
      - name: Состояние и логи
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Остановить и удалить тома
        if: always()
        run: docker compose down -v
