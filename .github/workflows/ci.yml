name: Проверки

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rules:
    name: Правила CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-rules.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Тесты создают свою базу через служебную базу postgres и применяют миграции Alembic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capper
          POSTGRES_PASSWORD: capper
          POSTGRES_DB: capper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPPER_DATABASE_URL: postgresql+asyncpg://capper:capper@localhost:5432/capper
      CAPPER_TEST_ADMIN_DATABASE_URL: postgresql://capper:capper@localhost:5432/postgres
      CAPPER_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
