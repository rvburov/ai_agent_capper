[project]
name = "ai-capper-backend"
version = "0.1.0"
description = "AI Capper: серверная часть (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
]
# Добавляются на этапе 1 вместе с кодом, который их использует:
# sqlalchemy[asyncio], asyncpg, alembic, arq, redis, argon2-cffi, pyotp, anthropic, httpx

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "httpx2>=2.13",
  "ruff>=0.16",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# RUF001–RUF003 считают кириллицу в строках и комментариях подозрительной, для нас это норма
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
