[project]
name = "ai-capper-backend"
version = "0.1.0"
description = "AI Capper: серверная часть (FastAPI)"
requires-python = ">=3.12"
# Здесь — нижние границы. Точные версии с хешами, по которым ставят CI и Dockerfile, —
# requirements.lock и requirements-dev.lock: после правки списков их пересобирают (README,
# раздел «Зависимости»). От версий pydantic и FastAPI зависит схема OpenAPI
# (frontend/openapi.json, CI сверяет ее с кодом): их поднимаем вместе с npm run gen:api
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1.4",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "arq>=0.28",
  # arq 0.28 требует redis < 6
  "redis[hiredis]>=5.3,<6",
  "argon2-cffi>=25.1",
  "pyotp>=2.10",
  "cryptography>=50.0.2",
  "segno>=1.6.6",
  "httpx>=0.28.1",
  "anthropic>=1.12.1",
  "structlog>=26.1",
  # Эло, метрики и бутстрэп бэктеста (app/ml); scikit-learn, pandas и scipy не нужны
  "numpy>=2.5",
  # Файлы .xlsx tennis-data.co.uk (app/ingest)
  "openpyxl>=3.1.5",
  # Push-уведомления браузера (этап 6): шифрование aes128gcm (RFC 8291) и подпись VAPID
  # (RFC 8292); запрос к сервису push отправляет httpx (app/services/push.py)
  "pywebpush>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "httpx2>=2.13.1",
  "ruff>=0.16.10",
  "mypy>=2.4",
  # Типы openpyxl для mypy в строгом режиме
  "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# RUF001–RUF003 считают кириллицу в строках и комментариях подозрительной, для нас это норма
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# conftest задает переменные окружения до импорта приложения
"tests/conftest.py" = ["E402"]
# миграции пишутся в стиле Alembic: длинные вызовы op.create_table
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# папка backend/alembic с миграциями не должна считаться своим пакетом
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# зависимости FastAPI в значениях по умолчанию — норма
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
# Миграции — по путям, а не пакетом: папка alembic не должна заслонять библиотеку alembic
files = ["app", "tests", "alembic/env.py", "alembic/versions"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# у asyncpg нет аннотаций типов; в коде он нужен только тестам (создание базы)
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# у pywebpush, py_vapid и http_ece нет аннотаций типов (push, этап 6)
module = ["pywebpush", "pywebpush.*", "py_vapid", "py_vapid.*", "http_ece", "http_ece.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# один цикл событий на весь сеанс тестов: движок БД и клиент Redis общие
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
  # незакрытые соединения и файлы — ошибка теста, а не тихое предупреждение
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  # arq 0.28 закрывает Redis устаревшим close(); исправить можно только в самом arq
  "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]
